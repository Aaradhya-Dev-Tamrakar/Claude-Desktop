name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
    paths:
      - 'mcp-servers/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'launch.bat'
      - 'launch_user_n.ps1'
      - 'bypass-all-profiles.ps1'
      - 'disable-autoupdate.ps1'
      - 'reset_profiles.ps1'
      - 'cooldown-reminder.ps1'
      - 'usage-watchdog.ps1'
      - '.github/workflows/ci.yml'
      - '!orchestrator-state/**'
      - '!dev-logs/**'
      - '!graphify-out/**'
      - '!outputs/**'
      - '!benchmarks/**'
      - '!worker-prompts/**'
      - '!team-memory.md'
      - '!**.md'
  pull_request:
    branches:
      - main
    paths:
      - 'mcp-servers/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'launch.bat'
      - 'launch_user_n.ps1'
      - 'bypass-all-profiles.ps1'
      - 'disable-autoupdate.ps1'
      - 'reset_profiles.ps1'
      - 'cooldown-reminder.ps1'
      - 'usage-watchdog.ps1'
      - '.github/workflows/ci.yml'
      - '!orchestrator-state/**'
      - '!dev-logs/**'
      - '!graphify-out/**'
      - '!outputs/**'
      - '!benchmarks/**'
      - '!worker-prompts/**'
      - '!team-memory.md'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Self-Healing & Repository Integrity Gate
  # --------------------------------------------------------------------------
  audit-and-heal:
    name: 🛡️ Audit & Self-Healing Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Self-Healing, Schema & Secret Audit
        run: |
          python scripts/ci_self_healing.py --heal

  # --------------------------------------------------------------------------
  # 2. Comprehensive Python & Invariant Verification Matrix
  # --------------------------------------------------------------------------
  python-tests:
    name: 🐍 Python Suite (${{ matrix.python-version }})
    needs: audit-and-heal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies with network retry
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 30 -r requirements.txt

      - name: Run FastMCP Pytest Suite (37 Specs)
        run: |
          python -m pytest tests/orchestrator_mcp_test.py -q --tb=short

      - name: Verify Live E2E Task Lifecycle
        run: |
          python scripts/test_e2e_task_lifecycle.py

      - name: Verify Live Multi-Account Scratchpad Handshake
        run: |
          python scripts/test_multi_account_scratchpad_handshake.py

  # --------------------------------------------------------------------------
  # 3. Adversarial Security & Claim Token Defense Gate
  # --------------------------------------------------------------------------
  lease-security:
    name: 🔒 Lease Security (Adversarial)
    needs: audit-and-heal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --retries 5 --timeout 30 -r requirements.txt

      - name: Run adversarial lease coverage
        run: |
          python -m pytest tests/orchestrator_mcp_test.py -k "TestClaimRace or test_submit_qa_review_lifecycle" -v --tb=short

  # --------------------------------------------------------------------------
  # 4. Windows PowerShell Automation & Pester Suite
  # --------------------------------------------------------------------------
  powershell-tests:
    name: ⚡ PowerShell Pester Suite
    needs: audit-and-heal
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester (v5+)
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          if (-not $pester) {
            Write-Host "Installing Pester module..." -ForegroundColor Cyan
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Run PowerShell Pester Tests (51 Specs)
        shell: pwsh
        run: |
          Invoke-Pester .\tests\launch_user_n.Tests.ps1 -Output Detailed

  # --------------------------------------------------------------------------
  # 5. Dynamic CI Gatekeeper & Consolidated Dashboard
  # --------------------------------------------------------------------------
  ci-gatekeeper:
    name: 🎯 CI Gatekeeper
    needs: [audit-and-heal, python-tests, lease-security, powershell-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Results
        run: |
          AUDIT="${{ needs.audit-and-heal.result }}"
          PY_TESTS="${{ needs.python-tests.result }}"
          LEASE="${{ needs.lease-security.result }}"
          PWSH="${{ needs.powershell-tests.result }}"

          echo "Audit Result: $AUDIT"
          echo "Python Matrix Result: $PY_TESTS"
          echo "Lease Security Result: $LEASE"
          echo "PowerShell Result: $PWSH"

          if [ "$AUDIT" != "success" ] || [ "$PY_TESTS" != "success" ] || [ "$LEASE" != "success" ] || [ "$PWSH" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed."
            exit 1
          fi
          echo "All upstream jobs succeeded. CI Gatekeeper certification complete."
