name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run Python tests
        run: python -m pytest tests -q

  lease-security:
    name: Lease security (adversarial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run adversarial lease coverage
        run: python -m pytest tests/test_remote_mcp.py::test_mcp_mutations_require_current_claim_token -q

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser
      - name: Run PowerShell tests
        shell: pwsh
        run: Invoke-Pester .\tests\launch_user_n.Tests.ps1 -CI -Output Detailed
